[versions]
cirrus = "4.2.4"
lamp = "4.0.0"
lombok = "1.18.44"
gson = "2.14.0"
snakeyaml = "2.7"
httpclient5 = "5.6.5"
libby = "2.0.0-SNAPSHOT"
netty = "4.2.19.Final"
packetevents = "2.14.0"
replay-recording = "1.1.7"
velocity = "4.3.0"
paper = "26.3.build.+"
adventure = "5.2.0"
junit-bom = "6.1.3"
mockito-inline = "5.2.0"
mockito-junit-jupiter = "5.20.0"
proto = "1.6.1"
protobuf-java = "4.36.2"
java-websocket = "1.6.0"
guava = "33.7.2-jre"
polar-api = "2.3.0"
intave-access = "14.4.2"
annotations = "26.1.0"
strokk = "2.3.1"

shadow = "9.6.1"
run = "3.1.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

proto = { module = "gg.modl:proto", version.ref = "proto" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-java" }
protobuf-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf-java" }

cirrus-api = { module = "gg.modl.minecraft.cirrus:cirrus-api", version.ref = "cirrus" }
cirrus-spigot = { module = "gg.modl.minecraft.cirrus:cirrus-spigot", version.ref = "cirrus" }
cirrus-velocity = { module = "gg.modl.minecraft.cirrus:cirrus-velocity", version.ref = "cirrus" }

lamp-common = { module = "io.github.revxrsal:lamp.common", version.ref = "lamp" }
lamp-bukkit = { module = "io.github.revxrsal:lamp.bukkit", version.ref = "lamp" }
lamp-brigadier = { module = "io.github.revxrsal:lamp.brigadier", version.ref = "lamp" }
lamp-velocity = { module = "io.github.revxrsal:lamp.velocity", version.ref = "lamp" }

strokk-paper = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokk" }
strokk-paper-processor = { module = "net.strokkur.commands:processor-paper", version.ref = "strokk" }

snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }

packetevents-api = { module = "com.github.retrooper:packetevents-api", version.ref = "packetevents" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
packetevents-velocity = { module = "com.github.retrooper:packetevents-velocity", version.ref = "packetevents" }

libby-core = { module = "com.alessiodp.libby:libby-core", version.ref = "libby" }
libby-velocity = { module = "com.alessiodp.libby:libby-velocity", version.ref = "libby" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

polar-api = { module = "top.polar:api", version.ref = "polar-api" }
intave-access = { module = "de.jpx3.intave.access:intave-access", version.ref = "intave-access" }

replay-recording = { module = "gg.modl.minecraft.replay:modl-replay-recording", version.ref = "replay-recording" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito-inline" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito-junit-jupiter" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run" }