      - "<gray>Reports ({report_count}):"
      - "{report-list}"
      - ""
      - "<red>Left-click to inspect"
      - "<green>Right-click to target"
    # Placeholders: {date}, {details}, {reporter}
    report_entry: " <gold>- <yellow>{date} {reporter}: <white>{details}"
    reports_more: " <yellow>... and {count} more"
    no_reports: " <yellow>No reports"

