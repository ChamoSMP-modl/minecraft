      - "<gray>Role: <white>{role}"
      - "<gray>Minecraft: <white>{minecraft_username}"
      - ""
      - "<gray>Online: {is_online} ({last_seen_or_session_time} on {server})"
      - "<gray>Playtime: <white>{playtime}"
