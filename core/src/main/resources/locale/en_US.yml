    title: "<yellow>{date} {id} ({status}<yellow>)"
    lore:
      - "<gray>Reported by <green>{reporter} <gray>({type})"
      - "<white> "
      - "{content}"
      - "<white> "
      - "<red>Left-click to inspect player"
      - "<green>Right-click to dismiss report"

  # Alt account items
  alt_item:
    title: "{color}{player_name}"
    lore:
      - "<dark_gray>{uuid}"
      - "<white> "
      - "<gray>Online: {is_online} ({last_seen_or_session_time} on {server})"
