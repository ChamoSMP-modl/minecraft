    title: "<green>{date} {id}"
    lore:
      - "<gray>Reported by <green>{reporter} <gray>({type})"
      - "<white> "
      - "{content}"
      - "<white> "
      - "<yellow>Click to deselect"

  # Staff Members Menu (lore template for each staff entry)
