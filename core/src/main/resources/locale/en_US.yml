# Punishment System Messages
# Available variables: {player}, {target}, {reason}, {duration}, {type}, {id}, {issuer}, {punishment_type}, {expiration}, {server}
# General punishment messages
general:
  # Permission messages
  players_only: "<red>This command can only be used by players."
  no_permission: "<red>You don't have permission to use this command."
  no_permission_punishment: "<red>You don't have permission to apply '{type}' punishments."
  no_permission_reload: "<red>You don't have permission to reload punishment data."
  invalid_syntax: "<red>Invalid command syntax. Please check your usage."
  gui_requires_player: "<red>This command opens a GUI and can only be executed by a player. Use <white>-p <red>for text output."
  gui_unavailable: "<red>GUI menus are not available on this proxy."
  
  # Error messages
  unknown: "Unknown"
  staff: "Staff"
  player_not_found: "<red>Player not found."
  punishment_error: "<red>Error creating punishment: {error}"
  punishment_types_not_loaded: "<red>Punishment types not loaded. Try <white>/modl reload<red> or contact an administrator."
  invalid_punishment_type: "<red>Invalid punishment type. Available types: {types}"
  invalid_duration: "<red>Invalid duration format. Examples: 1d, 2h, 30m, 1w"
  cannot_punish_self: "<red>You cannot punish yourself."
  target_immune: "<red>You cannot punish {target} as they have immunity."
  
  # Success messages
  punishment_issued: "<green>Successfully issued {type} for <white>{target}<green>."
  punishment_issued_duration: "<green>Successfully issued {type} for <white>{target}<green> ({duration})."
  
  # Reload messages
  reloading: "<yellow>Reloading..."
  reload_success: "<green>Reload complete."
  reload_error: "<red>Error reloading: {error}"

# Punishment type validation messages
validation:
  single_severity_error: "<red>Cannot set severity on single-severity punishment type '{type}'. This punishment type has only one severity level."
  permanent_skin_change_error: "<red>Cannot set severity on permanent until skin change punishment type '{type}'."
  permanent_username_change_error: "<red>Cannot set severity on permanent until username change punishment type '{type}'."
  alt_blocking_not_supported: "<red>Alt-blocking flag is not supported for punishment type '{type}'."
  stat_wiping_not_supported: "<red>Stat-wiping flag is not supported for punishment type '{type}'."

# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "have been"
  tense_active: "are"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "has been"
  tense2_active: "is"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "temporarily"
  permanently: "permanently"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n<gray>This {type} will expire in <white>{duration}<gray>."
  duration_formatted: "\n<gray>This {type} will expire in {duration}"
  mute_duration_formatted: " for {duration}"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: " for {duration}"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "ban"
  type_mute: "mute"
  type_punishment: "punishment"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanent"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
# 
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "<red>{target} has been banned."
    mute_default: "<red>{target} has been muted."
    kick_default: "<red>{target} has been kicked."
    default: "<red>{target} has been punished."
  mute_fallback: "<red>You are muted!"
  player_notification:
    ban_default: "<red>You {tense} banned (#{id})."
    mute_default: "<red>You {tense} muted (#{id})."
    kick_default: "<red>You have been kicked (#{id})."
    default: "<red>You {tense} punished (#{id})."

punishment_types:
  ordinal_0: # Kick
    public_notification: "<red>{target} has been kicked."
    player_notification:
      - "<red><b>You were kicked from the server."
      - "<white>{reason} <gray>(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "<red>{target} has been muted."
    player_notification:
      - ""
      - "<red>You {tense} {temp} muted{for_duration}"
      - "<gray>{issued} | #{id} | {appeal_url}"
      - "<white>{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "<red>{target} has been banned."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{reason}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "<red>{target} has been banned."
    player_notification:
      - "<red><b>Your account {tense2} restricted due to security concerns."
      - "<white>Suspicious activity has been detected on your account. Please secure your account and open an appeal at {appeal_url} using ID #{id}."
      
  ordinal_4:  # Linked Ban
    public_notification: "<red>{target} has been banned."
    player_notification:
      - "<red><b>Your account {tense2} linked to a banned account."
      - ""
      - "<white>Evading bans through the use of alternate accounts or sharing your account is strictly prohibited."
      - ""
      - "<gray>This ban will be automatically lifted upon the linked ban lapsing."
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}"
      
  ordinal_5:  # Blacklist
    public_notification: "<red>{target} has been blacklisted."
    player_notification:
      - "<red>You {tense} blacklisted"
      - "<gray>ID: #{id}"

  ordinal_6: # Chat abuse
    public_notification: "<red>{target} has been muted for chat abuse."
    player_notification:
      - ""
      - "<red>You {tense} {temp} muted{for_duration}"
      - "<gray>{issued} | #{id} | {appeal_url}"
      - "<white>{player_description}"
      - ""
  ordinal_7: # anti social
    public_notification: "<red>{target} has been muted for anti social behavior."
    player_notification:
      - ""
      - "<red>You {tense} {temp} muted{for_duration}"
      - "<gray>{issued} | #{id} | {appeal_url}"
      - "<white>{player_description}"
      - ""

  ordinal_8: # targeting
    public_notification: "<red>{target} has been banned for targeting."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_9: # bad content
    public_notification: "<red>{target} has been banned for inappropriate content."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_10: # Bad username
    public_notification: "<red>{target} has been banned."
    player_notification:
      - "<red><b>You {tense} banned due to your Minecraft username."
      - ""
      - "<white>{reason}"
      - ""
      - "<gray>This ban will be automatically lifted when you change your username."
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}"

  ordinal_11: # Bad skin
    public_notification: "<red>{target} has been banned."
    player_notification:
      - "<red><b>You {tense} banned due to your Minecraft skin."
      - ""
      - "<white>{reason}"
      - ""
      - "<gray>This ban will be automatically lifted when you change your skin."
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}"

  ordinal_12: # team abuse
    public_notification: "<red>{target} has been banned for team abuse."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_13: # game abuse
    public_notification: "<red>{target} has been banned for game abuse."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_14: # cheating
    public_notification: "<red>{target} has been banned for cheating."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_15: # game trading
    public_notification: "<red>{target} has been banned for game trading."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_16: # account abuse
    public_notification: "<red>{target} has been banned for account abuse."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

  ordinal_17: # systems abuse
    public_notification: "<red>{target} has been banned for system abuse."
    player_notification:
      - "<red><b>You {tense} {temp} banned for:"
      - ""
      - "<white>{player_description}"
      - "<gray>{will_expire}"
      - "<gray>Is this an error? Appeal at {appeal_url} using ID #{id}."

