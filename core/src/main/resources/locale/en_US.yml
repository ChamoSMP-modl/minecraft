    title: "<yellow>{date} {id} ({status}<yellow>)"
    lore:
      - "<gray>{title}"
      - "<white> "
      - "{content}"
  link_report_item_unselected:
    title: "<yellow>{date} {id}"
    lore:
      - "<gray>Reported by <green>{reporter} <gray>({type})"
      - "<white> "
      - "{content}"
      - "<white> "
      - "<yellow>Click to select"
