  # Empty placeholders for lists
  empty:
    history: "No punishment history"
    notes: "No staff notes"
    reports: "No reports filed"
    alts: "No linked accounts"
    tickets: "No tickets"
    staff_reports: "No reports"

  # Staff menu - Tickets
  ticket_item:
    title: "<gold>Ticket #{id}"
    lore:
      - "<gray>Player: <white>{player}"
      - "<gray>Title: <white>{title}"
      - "<gray>Created: <white>{date}"
      - "<gray>Status: {status}"
      - "<white> "
      - "<yellow>Click to open in panel"

  # Staff menu - Reports
  staff_report_item:
    title: "<yellow>{date} {id} ({status}<yellow>)"
    lore:
      - "<red>{reported}<gray> reported by <green>{reporter} <gray>({type})"
      - "<white> "
      - "{content}"
      - "<white> "
      - "<red>Left-click to inspect player"
      - "<green>Right-click to dismiss report"
