staff_mode:
  target:
    cleared: "<green>You are no longer targeting <white>{player}<green>."
    now_targeting: "<green>You are now targeting <white>{player}<green>."
    disconnected: "<red>{player} disconnected. Returning to staff mode."
  vanish:
    "on": "<green>You are now vanished."
    "off": "<green>You are no longer vanished."
  random_teleport:
    no_players: "<red>No players available to teleport to."
    teleported: "<green>Teleported to <white>{player}<green>."
  freeze:
    frozen: "<green>You froze <white>{player}<green>."
    unfrozen: "<green>You unfroze <white>{player}<green>."
  teleport:
    teleported: "<green>Teleported to <white>{player}<white>."
    target_offline: "<red>Target is no longer online."

freeze:
  frozen: "<red><b>You have been frozen by a staff member. Do not disconnect."
  unfrozen: "<green>You have been unfrozen."
  chat: "<aqua>[Frozen] <yellow>{player}<white>: {message}"
  no_commands: "<red>You cannot use commands while frozen."

command:
  modlbridge:
    usage: "Usage: <green>/modlbridge reload"
    no_permission: "<red>You do not have permission to use this command."
    reloading: "<yellow>Reloading modl bridge configuration..."
    reloaded: "<green>Bridge configuration reloaded."
    reload_failed: "<red>Reloaded with errors in: <white>{files}<red>. Check the console for details."
    restart_required: "<yellow>These settings only apply after a restart: <white>{keys}"
  proxycmd:
    console_only: "<red>This command can only be executed from console."
    usage: "Usage: <green>/proxycmd <white><command>"
    modl_on_spigot: "<red>Cannot use proxycmd when modl plugin is installed on the same server."
    not_connected: "<red>Not connected to modl plugin. Ensure the proxy plugin is running and connected."
    sent: "<green>Forwarded command: {command}"
    failed: "<red>Failed to forward command. No active connections."