# Staff Mode Configuration
# Staff can enter a moderation mode with custom hotbar, scoreboard, and vanish.

# Automatically vanish when entering staff mode
vanish_on_enable: true

# Staff mode hotbar layout
# Actions: target_selector, vanish_toggle, staff_menu, random_teleport
staff_hotbar:
  0:
    item: "minecraft:lead"
    name: "<green>Target Player"
    action: "target_selector"
    lore:
      - "<gray>Right-click to select"
      - "<gray>a player to target."
  4:
    item: "minecraft:compass"
    name: "<yellow>Random Teleport"
    action: "random_teleport"
    lore:
      - "<gray>Teleport to a random"
      - "<gray>online player."
  7:
    item: "minecraft:lime_dye"
    name: "<green>Vanish: ON"
    action: "vanish_toggle"
    toggle_item: "minecraft:gray_dye"
    toggle_name: "<gray>Vanish: OFF"
    lore:
      - "<gray>You are currently <green>hidden"
      - "<gray>from all players."
    toggle_lore:
      - "<gray>You are currently <red>visible"
      - "<gray>to all players."
  8:
    item: "minecraft:nether_star"
    name: "<aqua>Staff Menu"
    action: "staff_menu"
    lore:
      - "<gray>Open the staff"
      - "<gray>tools menu."

# Target mode hotbar layout
# Actions: freeze_target, stop_target, inspect_target, open_inventory, teleport_to_target, hackreport_target
target_hotbar:
  0:
    item: "minecraft:ender_eye"
    name: "<yellow>Teleport to Target"
    action: "teleport_to_target"
    lore:
      - "<gray>Teleport to the"
      - "<gray>targeted player."
  1:
    item: "minecraft:chest"
    name: "<yellow>Open Target Inventory"
    action: "open_inventory"
    lore:
      - "<gray>View the target's"
      - "<gray>inventory contents."
  2:
    item: "minecraft:blaze_rod"
    name: "<green>Inspect Target"
    action: "inspect_target"
    lore:
      - "<gray>Open detailed info"
      - "<gray>about the target."
  4:
    item: "minecraft:ice"
    name: "<aqua>Freeze Target"
    action: "freeze_target"
    lore:
      - "<gray>Freeze the targeted"
      - "<gray>player in place."
  6:
    item: "minecraft:book"
    name: "<red>Hack Report"
    action: "hackreport_target"
    lore:
      - "<gray>Report the targeted player"
      - "<gray>for cheating and capture a replay."
  7:
    item: "minecraft:lime_dye"
    name: "<green>Vanish: ON"
    action: "vanish_toggle"
    toggle_item: "minecraft:gray_dye"
    toggle_name: "<gray>Vanish: OFF"
    lore:
      - "<gray>You are currently <green>hidden"
      - "<gray>from all players."
    toggle_lore:
      - "<gray>You are currently <red>visible"
      - "<gray>to all players."
  8:
    item: "minecraft:red_bed"
    name: "<red>Stop Targeting"
    action: "stop_target"
    lore:
      - "<gray>Stop targeting and"
      - "<gray>return to staff mode."

# Staff scoreboard (shown while in staff mode, not targeting)
# Placeholders: {player_name}, {server}, {online}, {max_players}, {vanish_status}, {staff_online}, {date}, {vanished}
staff_scoreboard:
  enabled: true
  vanish: " <gray>[V]"
  title: "<aqua><bold>MOD MODE{vanish}"
  lines:
    - "<gray>{date} <dark_gray>{server}"
    - ""
    - "<white>Players: <green>{online}"
    - "<white>Staff: <gold>{staff_online}"
    - ""
    - "<yellow>server.com"

# Target scoreboard (shown while targeting a player)
# Placeholders: {player_name}, {target_name}, {target_health}, {target_ping}, {freeze_status}, {server}, {online}, {max_players}, {date}, {vanished}
target_scoreboard:
  enabled: true
  vanish: " <gray>[V]"
  title: "<aqua><bold>MOD MODE{vanish}"
  lines:
    - "<gray>{date} <dark_gray>{server}"
    - ""
    - "<white>Targeting:"
    - "<green>{target_name}"
    - "<red>{target_health} ❤️ <gray>| <aqua>{target_ping}ms"
    - ""
    - "<yellow>server.com"