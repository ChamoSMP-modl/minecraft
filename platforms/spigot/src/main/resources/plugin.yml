name: "ChamoSMP modl"
provides: [ "modl" ]

main: gg.modl.minecraft.spigot.SpigotPlugin
paper-plugin-loader: gg.modl.minecraft.spigot.PaperLoader

version: ${version}
authors: [ "ChamoSMP Development Team", "Chamogelastos", "byteful", "tigerbong" ]
description: ${description}
website: "https://github.com/ChamoSMP-modl/minecraft"

api-version: 1.21.11
folia-supported: true

softdepend:
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - GrimAC
  - Polar
  - Intave
  - packetevents

permissions:
  modl.bridge.reload:
    description: Reload the modl bridge configuration
    default: op
